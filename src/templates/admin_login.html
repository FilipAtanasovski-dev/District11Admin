<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background: #f4f5f7;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .login-container {
            width: 100%;

            max-width: 420px;

            padding: 20px;
        }

        .login-box {
            background: white;

            padding: 40px;

            border-radius: 12px;

            border: 1px solid #e1e1e1;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.05);
        }

        .login-box h1 {
            font-size: 28px;

            margin-bottom: 8px;
        }

        .login-box p {
            color: #777;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border:
                1px solid #d5d5d5;

            border-radius: 6px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        input:focus {
            border-color: #888;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.05);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition:
                background 0.15s,
                opacity 0.15s;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #222;
        }

        /* ================================
           ERROR MESSAGE
           ================================= */

        .error {
            display: none;

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 6px;

            background: #fff1f1;

            border: 1px solid #f0cccc;

            color: #a33;

            font-size: 14px;

            line-height: 1.4;
        }

        .error.show {
            display: block;
        }

        /* ================================
           LOADING
           ================================= */

        .loading {
            display: none;
        }

        button.loading-button .normal-text {
            display: none;
        }

        button.loading-button .loading {
            display: inline;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-box">

        <h1>
            Admin Login
        </h1>

        <p>
            Enter your administrator credentials
            to continue.
        </p>


        <!-- =========================================
             ERROR MESSAGE
             ========================================= -->

        <div
            id="error-message"
            class="error"
        ></div>


        <!-- =========================================
             LOGIN FORM
             ========================================= -->

        <form id="login-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="login-button"
            >

                <span class="normal-text">
                    Sign In
                </span>

                <span class="loading">
                    Signing in...
                </span>

            </button>

        </form>


        <a
            href="/"
            class="back"
        >
            ← Back
        </a>

    </div>

</div>


<script>

/* =====================================================
   LOGIN
   ===================================================== */

document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const button =
                document
                    .getElementById("login-button");


            const errorMessage =
                document
                    .getElementById("error-message");


            /*
             * Hide any previous error.
             */

            errorMessage.classList.remove(
                "show"
            );

            errorMessage.textContent = "";


            /*
             * Disable button while request
             * is being processed.
             */

            button.disabled = true;

            button.classList.add(
                "loading-button"
            );


            try {

                /*
                 * Send credentials to:
                 *
                 * POST /api/admin/login
                 *
                 * The FastAPI backend expects:
                 *
                 * {
                 *     "username": "...",
                 *     "password": "..."
                 * }
                 */

                const response =
                    await fetch(
                        "/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            /*
                             * VERY IMPORTANT.
                             *
                             * This allows the browser
                             * to receive/store the
                             * authentication session
                             * cookie created by
                             * SessionMiddleware.
                             */

                            credentials: "include",

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })
                        }
                    );


                const data =
                    await response.json();


                /*
                 * Successful login.
                 */

                if (response.ok) {

                    window.location.href =
                        "/admin";

                    return;
                }


                /*
                 * Authentication failed.
                 */

                if (Array.isArray(data.detail)) {

                    errorMessage.textContent =
                        data.detail
                            .map(error => {
                                if (typeof error === "string") {
                                    return error;
                                }

                                return error.msg || "Invalid input.";
                            })
                            .join(" ");

                } else {

                    errorMessage.textContent =
                        data.detail ||
                        "Invalid username or password.";

                }

                errorMessage.classList.add(
                    "show"
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                errorMessage.textContent =
                    "Could not connect to the server. Please try again.";

                errorMessage.classList.add(
                    "show"
                );


            } finally {

                button.disabled = false;

                button.classList.remove(
                    "loading-button"
                );

            }

        }
    );

</script>


</body>

</html>
